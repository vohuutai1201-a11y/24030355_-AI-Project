<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Võ Hữu Tài | Giới thiệu</title>
  <style>
    :root {
      --ink: #243247;
      --muted: #607184;
      --accent: #667b78;
      --line: #e2e9e8;
      --surface: #ffffff;
      --background: #f2f3f1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #edf0ee, var(--background));
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    main {
      width: min(100%, 680px);
      overflow: hidden;
      border: 1px solid rgba(36, 50, 71, .08);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 18px 48px rgba(36, 50, 71, .10);
    }
    header {
      padding: 38px 42px 32px;
      background: #eff2f0;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.15; }
    .major { margin: 12px 0 0; color: var(--muted); font-size: 1.05rem; }
    section { padding: 8px 42px 24px; }
    article { padding: 22px 0; border-bottom: 1px solid var(--line); }
    article:last-child { border-bottom: 0; }
    h2 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .82rem;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    article p { margin: 0; font-size: 1.05rem; line-height: 1.65; }
    @media (max-width: 520px) {
      body { padding: 20px 14px; }
      header { padding: 30px 26px 26px; }
      section { padding: 4px 26px 16px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Giới thiệu cá nhân</p>
      <h1>Võ Hữu Tài</h1>
      <p class="major">Truyền Thông Số</p>
    </header>
    <section aria-label="Thông tin giới thiệu">
      <article>
        <h2>Kỹ năng</h2>
        <p>Ham học hỏi, chơi game</p>
      </article>
      <article>
        <h2>Mục tiêu nghề nghiệp</h2>
        <p>Tổ chức sự kiện, quay phim, chụp ảnh</p>
      </article>
    </section>
  </main>
  <div style="text-align:center; margin:32px 0;">
    <a href="home.html" style="display:inline-block; padding:12px 20px; border-radius:12px; background:#667b78; color:#fff; font:600 16px 'Segoe UI',Arial,sans-serif; text-decoration:none;">Quay lại Trang Chủ</a>
  </div>
</body>
</html>
